{% extends "base.html" %}
{% block content %}
<section class="painel estreito">
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="{% url 'signup' %}">Cadastre-se</a></p>
</section>
{% endblock %}
