{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoCurioso{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topo">
    <a class="logo" href="{% url 'marca_list' %}">🚗 AutoCurioso</a>
    <nav>
      {% if user.is_authenticated %}
        <span>Olá, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="link">Sair</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
        <a href="{% url 'signup' %}">Cadastrar</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="rodape">AutoCurioso · Projeto Django</footer>
</body>
</html>
