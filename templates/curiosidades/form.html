{% extends "base.html" %}
{% block content %}
<section class="painel estreito">
  <h1>{{ titulo }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Salvar</button>
    <a class="btn cinza" href="{% url 'marca_list' %}">Cancelar</a>
  </form>
</section>
{% endblock %}
